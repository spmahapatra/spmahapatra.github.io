    <text x="697" y="88" text-anchor="middle" font-size="11.5" font-weight="700" fill="#166534">✅ Fast Redis Cache Hit (~2m…</text>
    <text x="697" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#28253D">HTTP 200 (X-Cache: HIT)</text>
    <text x="697" y="128" text-anchor="middle" font-size="10.5" fill="#166534" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">redis-cache:6379 payload</text>
