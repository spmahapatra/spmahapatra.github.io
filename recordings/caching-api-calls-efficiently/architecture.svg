<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="840" height="380" role="img" aria-label="Architecture Overview comic strip for part-3-caching-api-calls-efficiently" font-family="'Comic Sans MS','Segoe Print','Chalkboard SE',cursive,sans-serif">
  <defs><marker id="ca" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L10 5 L0 9z" fill="#28253D"/></marker></defs>
