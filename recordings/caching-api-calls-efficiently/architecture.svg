    <text x="697" y="174" text-anchor="middle" font-size="11" font-style="italic" fill="#166534">&quot;2 ms. Blink and miss it!&quot;</text>
    <text x="808" y="62" text-anchor="end" font-size="9.5" font-weight="700" fill="#28253D">2ms HIT</text>
    <rect x="590" y="214" width="214" height="132" rx="10" fill="#FEF2F2" stroke="#dc2626" stroke-width="3" stroke-dasharray="7 5"/>
    <text x="697" y="236" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991b1b">🚫 Mitigated Upstream Outage</text>
    <text x="697" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">✗ 300ms+ Rate-Limit / Crash</text>
    <text x="697" y="278" text-anchor="middle" font-size="10.5" fill="#dc2626" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">Graceful fallback on Redis err</text>
