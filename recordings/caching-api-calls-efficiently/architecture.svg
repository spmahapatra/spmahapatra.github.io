<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" width="1120" height="430" role="img" aria-label="Request flow for caching-api-calls-efficiently" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<defs><marker id="arr-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L10 5 L0 9z" fill="#166534"/></marker><marker id="arr-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L10 5 L0 9z" fill="#dc2626"/></marker></defs>
<rect width="1120" height="430" rx="12" fill="#fffdf5"/>
<text x="560.0" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#28253D">GET /api/v1/characters</text>
<rect x="18.0" y="52" width="212.5" height="112" rx="10" fill="#F0FDFA" stroke="#2DD4BF" stroke-width="2.5"/><text x="30.0" y="80" font-size="11" font-weight="700" fill="#28253D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">GET /api/v1/characters</text><text x="30.0" y="104" font-size="12" fill="#34343c">?species=human&amp;status=alive</text><text x="30.0" y="138" font-size="11" font-weight="700" fill="#166534"></text>
<path d="M234.5 108.0 L300.5 108.0" stroke="#166534" stroke-width="2.5" fill="none" marker-end="url(#arr-ok)"/><text x="267.5" y="98.0" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">sort key</text>
<rect x="308.5" y="52" width="212.5" height="112" rx="10" fill="#FFF7ED" stroke="#FB923C" stroke-width="2.5"/><text x="320.5" y="80" font-size="11" font-weight="700" fill="#28253D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">sorted(args) + MD5</text><text x="320.5" y="104" font-size="12" fill="#34343c">canonical cache key</text><text x="320.5" y="138" font-size="11" font-weight="700" fill="#166534"></text>
<path d="M525.0 108.0 L591.0 108.0" stroke="#166534" stroke-width="2.5" fill="none" marker-end="url(#arr-ok)"/><text x="558.0" y="98.0" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">lookup</text>
<rect x="599.0" y="52" width="212.5" height="112" rx="10" fill="#FDF4FF" stroke="#E879F9" stroke-width="2.5"/><text x="611.0" y="80" font-size="11" font-weight="700" fill="#28253D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">redis.get(cache_key)</text><text x="611.0" y="104" font-size="12" fill="#34343c">socket_timeout=0.5</text><text x="611.0" y="138" font-size="11" font-weight="700" fill="#166534"></text>
<path d="M815.5 108.0 L881.5 108.0" stroke="#166534" stroke-width="2.5" fill="none" marker-end="url(#arr-ok)"/><text x="848.5" y="98.0" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">300→2 ms</text>
<rect x="889.5" y="52" width="212.5" height="112" rx="10" fill="#F0FDF4" stroke="#16a34a" stroke-width="2.5"/><text x="901.5" y="80" font-size="11" font-weight="700" fill="#28253D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">HTTP 200</text><text x="901.5" y="104" font-size="12" fill="#34343c">X-Cache: HIT · 2 ms</text><text x="901.5" y="138" font-size="11" font-weight="700" fill="#166534">VERIFIED</text>
<path d="M705.2 164 L705.2 234" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 5" fill="none" marker-end="url(#arr-bad)"/><text x="713.2" y="203.0" font-size="11" font-weight="700" fill="#991b1b">no try/except</text><rect x="599.0" y="242" width="360" height="96" rx="10" fill="#FEF2F2" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 5"/><text x="627.0" y="270" font-size="12" font-weight="700" fill="#991b1b">BLOCKED</text><text x="627.0" y="294" font-size="12" font-weight="700" fill="#991b1b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">redis.get raises</text><text x="627.0" y="316" font-size="12" fill="#585858">worker crash · HTTP 502</text>
</svg>
