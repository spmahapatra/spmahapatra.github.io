    <text x="420" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2d12">Flask CacheMiddleware Gate</text>

    <rect x="318" y="112" width="204" height="66" rx="8" fill="#fff" stroke="#28253D" stroke-width="2"/>
    <text x="420" y="133" text-anchor="middle" font-size="12" font-weight="700" fill="#28253D">Redis Lookup (try/except)</text>
    <text x="420" y="150" text-anchor="middle" font-size="10.5" fill="#0550ae" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">redis.get(cache_key)</text>
