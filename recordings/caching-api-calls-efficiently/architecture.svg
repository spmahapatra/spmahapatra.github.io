    <text x="420" y="226" text-anchor="middle" font-size="10.5" fill="#0550ae" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">redis.setex(key, ttl, json)</text>
    <text x="420" y="242" text-anchor="middle" font-size="10" fill="#757575">Caches upstream payload + allke…</text>

