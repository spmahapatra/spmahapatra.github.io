<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="840" height="380" role="img" aria-label="Architecture Overview comic strip for part-2-optimizing-dockerfiles-with-multi-stage-builds" font-family="'Comic Sans MS','Segoe Print','Chalkboard SE',cursive,sans-serif">
  <defs><marker id="ca" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L10 5 L0 9z" fill="#28253D"/></marker></defs>
  <rect width="840" height="380" rx="12" fill="#fffdf5"/>
  <g transform="rotate(-1 143 190)">
    <rect x="18" y="20" width="250" height="340" rx="12" fill="#F0FDFA" stroke="#28253D" stroke-width="3"/>
    <rect x="18" y="20" width="250" height="34" rx="12" fill="#2DD4BF" stroke="#28253D" stroke-width="3"/>
    <text x="143" y="43" text-anchor="middle" font-size="13.5" font-weight="700" fill="#134e4a">PANEL 1 · The Builder 🔨</text>

    <text x="143" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#134e4a">Stage 1: Builder Workspace</text>

    <rect x="40" y="115" width="206" height="48" rx="8" fill="#fff" stroke="#28253D" stroke-width="2"/>
    <text x="143" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#28253D">golang:1.22-bookworm</text>
    <text x="143" y="152" text-anchor="middle" font-size="10.5" fill="#0550ae" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">AS builder</text>

    <rect x="40" y="173" width="206" height="48" rx="8" fill="#fff" stroke="#28253D" stroke-width="2"/>
    <text x="143" y="193" text-anchor="middle" font-size="12" font-weight="700" fill="#28253D">Manifest Layer Cache</text>
    <text x="143" y="210" text-anchor="middle" font-size="10.5" fill="#0550ae" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">COPY go.mod go.sum</text>

    <rect x="40" y="231" width="206" height="48" rx="8" fill="#fff" stroke="#28253D" stroke-width="2"/>
    <text x="143" y="251" text-anchor="middle" font-size="12" font-weight="700" fill="#28253D">BuildKit Cache Mount</text>
    <text x="143" y="268" text-anchor="middle" font-size="10.5" fill="#0550ae" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">--mount=type=cache</text>

    <path d="M40 296 h206 a8 8 0 0 1 8 8 v22 a8 8 0 0 1 -8 8 h-150 l-18 14 l4 -14 h-42 a8 8 0 0 1 -8 -8 v-22 a8 8 0 0 1 8 -8z" fill="#fff" stroke="#28253D" stroke-width="2"/>
    <text x="145" y="316" text-anchor="middle" font-size="11.5" fill="#28253D">&quot;1.85 GB for a 25 MB app?&quot; 😱</text>

  </g>
  <path d="M272 190 L306 190" stroke="#28253D" stroke-width="3" fill="none" marker-end="url(#ca)"/>
  <g transform="rotate(1 420 190)">
    <rect x="295" y="20" width="250" height="340" rx="12" fill="#FFF7ED" stroke="#28253D" stroke-width="3"/>
    <rect x="295" y="20" width="250" height="34" rx="12" fill="#FB923C" stroke="#28253D" stroke-width="3"/>
    <text x="420" y="43" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7c2d12">PANEL 2 · The Diet 🥗</text>

    <text x="420" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2d12">Static Compilation Gate</text>

    <rect x="318" y="112" width="204" height="66" rx="8" fill="#fff" stroke="#28253D" stroke-width="2"/>
    <text x="420" y="133" text-anchor="middle" font-size="12" font-weight="700" fill="#28253D">Static ELF Binary</text>
    <text x="420" y="150" text-anchor="middle" font-size="10.5" fill="#0550ae" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">CGO_ENABLED=0 -ldflags=&#x27;-s …</text>
    <text x="420" y="166" text-anchor="middle" font-size="10" fill="#757575">Strips debug symbols &amp; libc deps</text>

    <rect x="318" y="188" width="204" height="66" rx="8" fill="#fff" stroke="#28253D" stroke-width="2"/>
    <text x="420" y="209" text-anchor="middle" font-size="12" font-weight="700" fill="#28253D">Selective Artifact Copy</text>
    <text x="420" y="226" text-anchor="middle" font-size="10.5" fill="#0550ae" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">COPY --from=builder /bin/app</text>
    <text x="420" y="242" text-anchor="middle" font-size="10" fill="#757575">Drops 1.8GB compiler layer tree</text>

    <path d="M318 272 h206 a8 8 0 0 1 8 8 v38 a8 8 0 0 1 -8 8 h-150 l-18 14 l4 -14 h-42 a8 8 0 0 1 -8 -8 v-38 a8 8 0 0 1 8 -8z" fill="#fff" stroke="#28253D" stroke-width="2"/>
    <text x="423" y="292" text-anchor="middle" font-size="11.5" fill="#28253D">&quot;Copy the binary,</text>
    <text x="423" y="307" text-anchor="middle" font-size="11.5" fill="#28253D">drop the rest!&quot; ✂️</text>

  </g>
  <path d="M549 190 L583 190" stroke="#28253D" stroke-width="3" fill="none" marker-end="url(#ca)"/>
  <g transform="rotate(-1 697 190)">
    <rect x="572" y="20" width="250" height="340" rx="12" fill="#FDF4FF" stroke="#28253D" stroke-width="3"/>
    <rect x="572" y="20" width="250" height="34" rx="12" fill="#E879F9" stroke="#28253D" stroke-width="3"/>
    <text x="697" y="43" text-anchor="middle" font-size="13.5" font-weight="700" fill="#581c87">PANEL 3 · The Runtime 🎬</text>

    <rect x="590" y="66" width="214" height="136" rx="10" fill="#F0FDF4" stroke="#16a34a" stroke-width="3"/>
    <text x="697" y="88" text-anchor="middle" font-size="11.5" font-weight="700" fill="#166534">✅ Minimal Distroless Runtime</text>
    <text x="697" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#28253D">distroless/static:nonroot</text>
    <text x="697" y="128" text-anchor="middle" font-size="10.5" fill="#166534" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">28.4 MB • USER 65532:65532</text>
    <text x="697" y="145" text-anchor="middle" font-size="10" fill="#585858">Fast pull &amp; zero shell CVEs</text>
    <text x="697" y="174" text-anchor="middle" font-size="11" font-style="italic" fill="#166534">&quot;28 MB. Light as a feather!&quot;</text>
    <text x="808" y="62" text-anchor="end" font-size="9.5" font-weight="700" fill="#28253D">28 MB</text>
    <rect x="590" y="214" width="214" height="132" rx="10" fill="#FEF2F2" stroke="#dc2626" stroke-width="3" stroke-dasharray="7 5"/>
    <text x="697" y="236" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991b1b">🚫 Dropped Bloat &amp; Attack Su…</text>
    <text x="697" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">✗ 1.85 GB Legacy Image</text>
    <text x="697" y="278" text-anchor="middle" font-size="10.5" fill="#dc2626" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">No gcc, apt, shell, or .git</text>
    <text x="697" y="295" text-anchor="middle" font-size="10" fill="#757575">Eliminates KubeletDiskPressure</text>
    <text x="697" y="326" text-anchor="middle" font-size="11" font-style="italic" fill="#991b1b">&quot;Bye bye, gcc and shell! 👋&quot;</text>
    <text x="808" y="210" text-anchor="end" font-size="9.5" font-weight="700" fill="#991b1b">DROPPED</text>

  </g>
</svg>
